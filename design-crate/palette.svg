563E" stroke="#D8D6CD"/><text y="224" font-size="25">Clay</text><text x="344" y="224" text-anchor="end" font-size="18" font-family="monospace">#AE563E</text><text y="255" font-size="17" fill="#686B63">Editorial accent</text></g><g transform="translate(800 514)"><rect width="344" height="186" rx="16" fill="#9CAAF0" stroke="#D8D6CD"/><text y="224" font-size="25">Periwinkle</text><text x="344" y="224" text-anchor="end" font-size="18" font-family="monospace">#9CAAF0</text><text y="255" font-size="17" fill="#686B63">Cool artwork</text></g><g transform="translate(1168 514)"><rect width="344" height="186" rx="16" fill="#E8BC78" stroke="#D8D6CD"/><text y="224" font-size="25">Marigold</text><text x="344" y="224" text-anchor="end" font-size="18" font-family="monospace">#E8BC78</text><text y="255" font-size="17" fill="#686B63">Warm artwork</text></g><path d="M64 860H1536" stroke="#D8D6CD"/><text x="64" y="907" font-size="18">Suggested balance: 80% quiet surface / 15% ink and structure / 5% expressive color</text><text x="64" y="948" font-size="16" fill="#686B63">An original personal palette inspired by Sarvam. These are proposed values, not Sarvam brand specifications.</text></g></svg>